name: Render and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Uncomment if a post ever executes Python code:
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #     cache: pip
      # - run: pip install -r requirements.txt

      - name: Render site
        run: quarto render

      # Requires Pages to be enabled once by hand:
      # Settings → Pages → Source: GitHub Actions.
      # GITHUB_TOKEN can deploy to Pages but cannot create the Pages site,
      # so `enablement: true` does not work here.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
